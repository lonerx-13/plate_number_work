Global:
  use_gpu: true # 是否使用GPU
  epoch_num: 100 # 训练轮数
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/rec_plate # 模型保存路径
  save_epoch_step: 1
  eval_batch_step: [0, 2000] # 每隔多少步进行一次评估
  cal_metric_during_train: true
  pretrained_model: # 可以加载预训练模型
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img: doc/imgs_words/ch/word_4.jpg
  character_dict_path: plate_dict.txt # 字典文件路径
  max_text_length: 8 # 车牌最大长度
  infer_mode: false
  use_space_char: false
  save_res_path: ./output/rec/predicts_chinese_plate_rec.txt

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.001
  regularizer:
    name: 'L2'
    factor: 0.00001

Architecture:
  model_type: rec
  algorithm: SVTR
  Transform:
  Backbone:
    name: SVTRNet
    img_size: [32, 100]
    out_char_num: 25
    out_channels: 192
    patch_merging: 'Conv'
    embed_dim: [64, 128, 256]
    depth: [3, 6, 3]
    num_heads: [2, 4, 8]
    mixer: ['Local','Local','Local','Local','Local','Local','Global','Global','Global','Global','Global','Global']
    local_mixer: [[7, 11], [7, 11], [7, 11]]
    last_stage: true
    prenorm: false
  Head:
    name: CTCHead
    fc_decay: 0.00001

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./
    label_file_list: ["./rec_labels.txt"]
    ratio_list: [1.0]
    transforms:
      - DecodeImage: # load image
          img_mode: BGR
          channel_first: false
      - RecAug: 
      - SVTRRecResizeImg:
          image_shape: [3, 32, 100]
      - KeepKeys:
          keep_keys: ['image', 'label', 'length'] # dataloader will return list in this order
  loader:
    shuffle: true
    batch_size_per_card: 256
    drop_last: true
    num_workers: 4

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./
    label_file_list: ["./rec_labels.txt"] # 评估也使用此标签文件，实际项目中应划分验证集
    ratio_list: [1.0]
    transforms:
      - DecodeImage: # load image
          img_mode: BGR
          channel_first: false
      - SVTRRecResizeImg:
          image_shape: [3, 32, 100]
      - KeepKeys:
          keep_keys: ['image', 'label', 'length'] # dataloader will return list in this order
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 256
    num_workers: 4